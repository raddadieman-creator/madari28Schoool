لنقل المدرسي ثم اسم الطالبة، ومتابعة حالة الطلب من الصفحة نفسها.",keywords:["نقل","باص","حافلة","مواصلات","توصيل","سواق"],links:[{label:"نظام نور",url:"https://noor.moe.gov.sa"}],contactId:"transport",category:"خدمات"},{id:"absence",question:"ماذا أفعل إذا غابت ابنتي بعذر؟",answer:"بلّغوا المدرسة في يوم الغياب قدر الإمكان، وأرسلوا ما يثبت العذر كالتقرير الطبي عند عودتها، وتابعوا ما فاتها عبر منصة مدرستي.",keywords:["غياب","غابت","عذر","تقرير طبي","مريضة","ما داومت"],to:{label:"دليل ماذا أفعل إذا؟",path:"/services#what-to-do"},contactId:"attendance",category:"مواظبة"},{id:"late",question:"تأخرت ابنتي عن الدوام",answer:"توجّه الطالبة إلى وكيلة المدرسة عند وصولها. إن تكرر التأخر، يُنصح بالتواصل مع المدرسة لفهم السبب والاتفاق على حل.",keywords:["تأخر","تاخرت","متأخرة","الطابور","وصلت متأخر"],contactId:"vice",category:"مواظبة"},{id:"leave",question:"كيف أستأذن لابنتي أثناء الدوام؟",answer:"يحضر ولي الأمر أو من يفوّضه رسميًا، ويُسجَّل الاستئذان لدى وكيلة المدرسة قبل خروج الطالبة. يُفضَّل الإبلاغ المسبق إن كان الموعد معروفًا.",keywords:["استئذان","استاذن","اطلعها","خروج","موعد مستشفى","اخذها بدري"],contactId:"vice",category:"مواظبة"},{id:"behavior-rules",question:"أين أجد قواعد السلوك والمواظبة؟",answer:"تطبّق المدرسة قواعد السلوك والمواظبة المعتمدة من وزارة التعليم بإصدارها الساري. تجدون ملخصًا وروابط في قسم التوجيه الطلابي.",keywords:["قواعد","سلوك","لائحة","مخالفة","عقوبة","خصم","درجات السلوك"],to:{label:"قواعد السلوك والمواظبة",path:"/guidance/behavior-attendance"},category:"توجيه"},{id:"bullying",question:"ابنتي تتعرض للتنمر، ماذا أفعل؟",answer:"استمعوا إليها بهدوء وطمئنوها، ودوّنوا ما حدث دون مواجهة الطرف الآخر بأنفسكم، ثم تواصلوا مع الموجهة الطلابية مباشرة؛ ستُعامل المعلومة بسرية. ويمكن أيضًا الاتصال بخط مساندة الطفل 116111.",keywords:["تنمر","يتنمرون","مضايقة","تضايقها","ضرب","سب","إساءة","يستهزئون"],to:{label:"الوقاية من التنمر",path:"/guidance/bullying"},links:[{label:"خط مساندة الطفل 116111",url:"tel:116111"}],contactId:"counselor",category:"توجيه"},{id:"counselor",question:"كيف أتواصل مع الموجهة الطلابية؟",answer:"تجدون طريقة التواصل مع الموجهة الطلابية في صفحة «تواصل معنا». تُعامل المعلومات التي تشاركونها معها بسرية.",keywords:["موجهة","مرشدة","المرشدة الطلابية","الاخصائية","استشارة"],to:{label:"تواصل معنا",path:"/contact"},contactId:"counselor",category:"تواصل"},{id:"exams-prep",question:"كيف تستعد ابنتي للاختبارات؟",answer:"قسّموا المادة إلى أجزاء صغيرة، وذاكروا على فترات قصيرة مع اختبار الذات بالأسئلة، واحرصوا على النوم الكافي. وفي قسم التوجيه دليل مفصل.",keywords:["اختبار","اختبارات","مذاكرة","امتحان","قلق الاختبار","توتر","استعداد"],to:{label:"الاستعداد للاختبارات",path:"/guidance/exams"},category:"توجيه"},{id:"exam-dates",question:"متى الاختبارات؟",answer:"تُعلن مواعيد الاختبارات في التقويم المدرسي بعد اعتمادها. المواعيد الظاهرة حاليًا تجريبية ومعلَّمة بذلك، فاعتمدوا على إعلان المدرسة الرسمي.",keywords:["موعد الاختبارات","متى الاختبار","جدول الاختبارات","تاريخ الاختبار"],to:{label:"التقويم",path:"/events"},contactId:"vice",category:"تقويم"},{id:"holidays",question:"متى الإجازة؟",answer:"الإجازات الرسمية يحددها التقويم الدراسي المعتمد من وزارة التعليم. تظهر في تقويم المنصة بعد اعتمادها، والمواعيد المعلّمة «تجريبي» ليست رسمية.",keywords:["اجازة","إجازة","عطلة","متى الاجازة","نهاية الفصل"],to:{label:"التقويم",path:"/events"},category:"تقويم"},{id:"mawhiba",question:"كيف تسجل ابنتي في موهبة؟",answer:"يُفتح التسجيل في مقياس موهبة وبرامجها في فترات تعلنها مؤسسة موهبة عبر موقعها الرسمي. منسقة موهبة في المدرسة تساعدكم في الترشيح والمتابعة.",keywords:["موهبة","موهوبة","مقياس موهبة","الموهوبين","برامج اثرائية","إبداع","اولمبياد"],links:[{label:"موقع موهبة",url:"https://www.mawhiba.sa"}],to:{label:"موهبة والإبداع",path:"/mawhiba"},category:"موهبة"},{id:"volunteer",question:"كيف تشارك ابنتي في العمل التطوعي؟",answer:"تجدون مبادرات المدرسة وشروط المشاركة في قسم العمل التطوعي. وللتسجيل الرسمي وتوثيق الساعات استخدموا المنصة الوطنية للعمل التطوعي بإشراف ولي الأمر.",keywords:["تطوع","تطوعي","ساعات تطوعية","شهادة تطوع","مبادرة"],lin
